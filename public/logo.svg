<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kai">
  <defs>
    <linearGradient id="kai-orb" x1="20" y1="14" x2="78" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB199"/>
      <stop offset="0.5" stop-color="#FB7A8E"/>
      <stop offset="1" stop-color="#B6A6FF"/>
    </linearGradient>
    <radialGradient id="kai-glow" cx="0.5" cy="0.42" r="0.6">
      <stop stop-color="#FFD9C2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FB7A8E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- soft glow -->
  <circle cx="48" cy="46" r="34" fill="url(#kai-glow)"/>
  <!-- orbit ring (the cycle of focus & rest) -->
  <ellipse cx="48" cy="48" rx="40" ry="40" stroke="#F4F1EE" stroke-opacity="0.28" stroke-width="2"/>
  <!-- the orb -->
  <circle cx="48" cy="46" r="22" fill="url(#kai-orb)"/>
  <!-- crescent shadow to give the orb form -->
  <circle cx="56" cy="42" r="22" fill="#1A1530" fill-opacity="0.28"/>
  <!-- the "right moment" — a bright point on the ring -->
  <circle cx="80" cy="34" r="5" fill="#FFE9D6"/>
  <circle cx="80" cy="34" r="9" fill="#FFE9D6" fill-opacity="0.25"/>
</svg>
